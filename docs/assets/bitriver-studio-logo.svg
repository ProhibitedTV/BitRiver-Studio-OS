    <path d="M26 146 C60 121 92 121 123 146 S186 171 199 147" stroke="#35697B" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M26 172 C60 147 92 147 123 172 S186 197 199 173" stroke="url(#signal)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M29 196 C62 181 96 181 125 197 S181 211 197 197" stroke="#53D8A7" stroke-width="6" stroke-linecap="round" fill="none" opacity=".7"/>
    <circle cx="113" cy="75" r="15" fill="#79E7FF"/>
    <path d="M85 104 Q113 78 141 104" fill="none" stroke="#66D0F2" stroke-width="8" stroke-linecap="round"/>
    <path d="M65 101 Q113 47 161 101" fill="none" stroke="#4B9EBD" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    <path d="M49 92 Q113 12 177 92" fill="none" stroke="#275769" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g fill="#EEF8FB" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">
    <text x="292" y="129" font-size="92" letter-spacing="-3">BitRiver</text>

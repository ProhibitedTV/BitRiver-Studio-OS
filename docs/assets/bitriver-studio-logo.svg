<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270" role="img" aria-labelledby="title desc">
  <title id="title">BitRiver Studio OS</title>
  <desc id="desc">An illuminated broadcast signal flowing into a stylized river, beside the BitRiver Studio OS wordmark.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102834"/>
      <stop offset="1" stop-color="#081318"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#79E7FF"/>
      <stop offset=".55" stop-color="#3DB8DC"/>
      <stop offset="1" stop-color="#53D8A7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#66D0F2"/>
      <stop offset="1" stop-color="#53D8A7"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="1116" height="266" rx="28" fill="url(#panel)" stroke="#204858" stroke-width="3"/>
  <g transform="translate(33 23)">

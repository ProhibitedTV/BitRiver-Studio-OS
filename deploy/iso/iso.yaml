# Only interactive entries. Never append inst.ks=, inst.cmdline or
# kickstart partitioning directives to a distribution ISO by default.
label: "BITRIVER-ISO"
grub2:
  timeout: 8
  entries:
    - name: "Install BitRiver Studio OS (experimental)"
      # Anaconda chooses the LAST console= device as its UI destination.
      # Mirror boot logs to serial but keep tty0 LAST for the graphical UI.
      # Reversing this order silently directs the installer to serial.
      linux: ${kernelpath} ${root} inst.graphical console=ttyS0,115200n8 console=tty0
      initrd: ${initrdpath}
    - name: "Troubleshoot installation (text, basic display)"
      # This is operator-selected only. Never force text/nomodeset on the
      # default graphical installer or the installed broadcast OS.
      linux: ${kernelpath} ${root} inst.text nomodeset rd.plymouth=0 plymouth.enable=0 console=ttyS0,115200n8
      initrd: ${initrdpath}

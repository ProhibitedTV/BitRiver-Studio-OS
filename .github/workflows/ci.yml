name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      POWERSHELL: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.5"

      - name: Install workspace dependencies
        run: npm install

      - name: Sync Go workspace
        run: go work sync

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Smoke and integration checks
        run: make smoke
